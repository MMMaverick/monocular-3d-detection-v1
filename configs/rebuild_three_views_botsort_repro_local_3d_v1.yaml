base_configs:
  - configs/rebuild_three_views_repair_params_full_wsl_v1.yaml

experiment:
  name: rebuild_three_views_botsort_repro_local_3d_v1
  mode: offline
  status: optimize_3d_boxes_from_locally_reproduced_botsort_tracks

inputs:
  annotations_dir: D:/vggt-omega/data/format_output/annotations/NV
  views:
    rear:
      camera_name: rear_camera
      image_dir: D:/vggt-omega/data/camera/rear_camera
      track_csv: outputs/robust_botsort_2d_rear_views_repro_local_v1/tracks_with_depth/rear_camera/tracks.csv
      mask_csv: outputs/robust_botsort_2d_rear_views_repro_local_v1/masks_ensured_for_3d/rear_camera/gt2d_sam_masks_ensured_cropped.csv
      intrinsic: D:/vggt-omega/data/calib/rear_camera/rear_camera-intrinsic.json
      camera_to_ego: D:/vggt-omega/data/calib/rear_camera/rear_camera-to-car_center-extrinsic.json
    left_rear:
      camera_name: left_rear_camera
      image_dir: D:/vggt-omega/data/camera/left_rear_camera
      track_csv: outputs/robust_botsort_2d_rear_views_repro_local_v1/tracks_with_depth/left_rear_camera/tracks.csv
      mask_csv: outputs/robust_botsort_2d_rear_views_repro_local_v1/masks_ensured_for_3d/left_rear_camera/gt2d_sam_masks_ensured_cropped.csv
      intrinsic: D:/vggt-omega/data/calib/left_rear_camera/left_rear_camera-intrinsic.json
      camera_to_ego: D:/vggt-omega/data/calib/left_rear_camera/left_rear_camera-to-car_center-extrinsic.json
    right_rear:
      camera_name: right_rear_camera
      image_dir: D:/vggt-omega/data/camera/right_rear_camera
      track_csv: outputs/robust_botsort_2d_rear_views_repro_local_v1/tracks_with_depth/right_rear_camera/tracks.csv
      mask_csv: outputs/robust_botsort_2d_rear_views_repro_local_v1/masks_ensured_for_3d/right_rear_camera/gt2d_sam_masks_ensured_cropped.csv
      intrinsic: D:/vggt-omega/data/calib/right_rear_camera/right_rear_camera-intrinsic.json
      camera_to_ego: D:/vggt-omega/data/calib/right_rear_camera/right_rear_camera-to-car_center-extrinsic.json

output:
  dir: outputs/rebuild_three_views_botsort_repro_local_3d_v1
