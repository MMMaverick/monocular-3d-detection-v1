name: mono-detect-original-2dbox-full-cpu
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - numpy=1.26.4
  - pyyaml
  - scipy
  - matplotlib
  - pandas
  - pillow
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - numpy==1.26.4
      - torch
      - torchvision
      - opencv-python==4.10.0.84
      - einops
      - omegaconf
      - imageio
      - requests
      - trimesh
      - moviepy==1.0.3
      - boxmot
