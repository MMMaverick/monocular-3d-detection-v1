name: mono-detect-original-2dbox-full-gpu
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - numpy=1.26.4
  - pyyaml
  - scipy
  - matplotlib
  - pandas
  - pillow
  - pip:
      # 当前 release 模式假设 2D box / track / mask / depth 初始化已经准备好。
      # 因此默认不安装 YOLO/SAM/Depth 等检测分割依赖，避免它们自动拉错 torch/numpy。
      # GPU torch/torchvision 请按 README 单独安装。
      - opencv-python==4.10.0.84
      - einops
      - omegaconf
      - imageio
      - requests
      - trimesh
      - moviepy==1.0.3
      - boxmot
